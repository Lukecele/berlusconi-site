<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="50%" stop-color="#0B152B"/>
      <stop offset="100%" stop-color="#03060D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="180" r="350" fill="url(#sunGlow)"/>
  <circle cx="150" cy="500" r="250" fill="#2563EB" fill-opacity="0.12"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>

  <!-- Brand Badge -->
  <g transform="translate(80, 80)">
    <rect width="52" height="52" rx="14" fill="#1E293B" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="26" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FCD34D" text-anchor="middle">SB</text>
    <text x="70" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#E2E8F0" letter-spacing="1">SILVIO BERLUSCONI</text>
    <text x="320" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#94A3B8">• EREDITÀ &amp; ISPIRAZIONE</text>
  </g>

  <!-- Main Headline Quote -->
  <text x="80" y="230" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="52" fill="#FFFFFF">
    "Sempre con il sole in tasca."
  </text>
  <text x="80" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="34" fill="url(#gold)">
    Chi ci crede combatte, supera gli ostacoli e vince.
  </text>

  <!-- Subtitle -->
  <text x="80" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    Il portale celebrativo sulla leadership, l'ottimismo pragmatico,
  </text>
  <text x="80" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    i grandi successi imprenditoriali e i discorsi storici che hanno fatto scuola.
  </text>

  <!-- Badges footer -->
  <g transform="translate(80, 480)">
    <rect width="180" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#FCD34D" text-anchor="middle">☀️ Ottimismo Costruttivo</text>

    <rect x="200" width="180" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="290" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#60A5FA" text-anchor="middle">🏆 29 Trofei col Milan</text>

    <rect x="400" width="190" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="495" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#34D399" text-anchor="middle">📺 Rivoluzione TV &amp; Impresa</text>
  </g>
</svg>
